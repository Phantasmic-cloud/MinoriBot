chat_max_tokens: null                    # 默认聊天最大生成长度
chat_model_switch_interval: 1            # 默认的模型失败切换间隔 (s)
chat_timeout: 180                        # 默认聊天超时时间 (s)

text_embedding_models:                    # 可用文本嵌入模型列表
  - name: "sf-bge-m3"
    provider: "sf"
    id: "BAAI/bge-m3"
    input_pricing:  0.00000000        
    embed_dim: 1024
  - name: "sf-qwen3-embedding-8b"
    provider: "sf"
    id: "Qwen/Qwen3-Embedding-8B"
    input_pricing: 0.00000004
    embed_dim: 4096                       
    
    
tts_models:                               # 文本转语音模型列表
  - name: "openai-tts"
    provider: "na"
    id: "tts-1"
    input_pricing:  0.000015               # 每个输入字符的价格
    voice: "alloy"                         # TTS语音名称


# ===== 统计卡片配置（/ts 与 /mas 共用） =====
draw:                         # 绘图通用项
  bg_dir: "data/llm/stat_bg"  # 背景图目录，随机抽一张；目录不存在或为空则用程序生成的光斑渐变底
  bg_fade: 0.12               # 背景图压暗程度（0~1），仅在有背景图时生效

token_stat:                   # /ts 统计卡片
  chat_top_n: 3               # 模型分布里单独列出的模型数（按总 token 消耗排名），其余合并
  other_label: "其它模型"     # 合并项显示名（固定灰色）

model_api_status:             # /mas 状态监控卡片
  slow_ms: 20000              # 单次请求耗时超过此值算"慢"（时间线标黄），单位毫秒
  ok_rate: 0.90               # 成功率 >= 此值 → 正常（绿）
  warn_rate: 0.80             # 成功率 >= 此值 → 警告（黄），低于则异常（红）
  max_show: 12                # 一次最多画多少个模型卡片
  notify:                     # 异常推送（事件驱动，跨状态才推）
    fail_streak: 3            # 连续失败 N 次 → 判异常
    fail_window: 10           # 滑窗长度：最近 N 次
    fail_count: 4             # 滑窗内失败 >= 此值 → 判异常
    recover_streak: 5         # 连续成功 N 次 → 判恢复
    recover_window: 9         # 滑窗长度：最近 N 次
    recover_count: 8          # 滑窗内成功 >= 此值 → 判恢复
    eval_limit: 10            # 每次评估取最近多少次调用（须 >= 上述各窗口）
    chart_max_span: 86400     # 推送图画图跨度上限（秒），超过则只画最近这一段
    flush_interval: 2         # 内存缓存批量落盘 sqlite 的间隔（秒）
