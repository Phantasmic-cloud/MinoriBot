log_level: INFO

rpc:
  host: "127.0.0.1"
  port: 555
  token: abc
  reconnect_interval: 5
  default_timeout: 5

text_embed_dim: 4096   # qwen3-embedding-8b 维度

image_caption:
  image_limit: 1.0
  image_prob: 1.0
  emotion_limit: 1.0
  emotion_prob: 0.2
  model: 
    - gg:gemini-3.8-flash
  timeout: 60
  max_tokens: 2048
  prompt: |
    该{sub_type}是在QQ群中由群友发送的，请你简短总结这张图片的内容用于视障人士理解图片。
    对于表情，着重描述表情可能表达的情绪。对于图片，着重描述图片中包含什么内容。
    如果有人物/角色，需要说明他是谁/来自哪个游戏。
    直接输出简短精炼的图片总结并结束，字数在100字以内，不需要附带其他额外语句。
  
summary:
  model:
    - gg:gemini-3.5-flash-lite
  timeout: 60
  max_tokens: 10240
  prompt: |
    请你阅读以下聊天记录，并简要总结出这段聊天的主要内容
    不需要带有当前时间信息，格式类似：xxx在讨论yyy 或者 xxx对yyy的看法是zzz 等
    请使用用户的QQ号而不是昵称来描述用户
    尽量简洁流畅、不分点、并包含尽可能多的信息，字数控制在100字以内:
    ```
    {text}
    ```

chat:
  willing:
    limit: 1.0                # 意愿值阈值，达到才发言
    increase_per_msg: 0.005   # 每条群消息涨多少意愿
    increase_per_at: 1.0      # 被@一次涨多少
    increase_per_reply: 0.3   # 有人回复bot涨多少
    decay_after_send: 0.6     # 发言后意愿乘以这个数（衰减）
    decrease_after_send: 0.5  # 发言后意愿额外减去这个数
    decrease_per_minute: 0.005 # 每分钟自然衰减多少
    increase_keywords:
      "实乃里": 0.3
      "小实": 0.4
      "小花": 0.4
      "米诺里": 0.3
      "mnr": 0.4
      "花花": 0.4
      "Minori": 0.2
      "minori": 0.2
                    # 消息含这个词额外涨多少意愿
    group_scale:
      "12345678": 3.0       # 该群意愿值整体倍率，填真实群号

  mem:
    short_em_num: 3
    long_em_num: 1
    em_time_decay_per_hour: 0.02

    short_em_reward: 1.0
    em_long_term_threshold: 10.0

    short_em_forget_days: 3
    short_em_forget_prob: 0.1

    sm_num: 5
    sm_keep_count: 10

    um_num: 3
    um_max_events: 5
    um_max_names: 10

  get_history_msg_delay_seconds: 0
  history_msg_num: 20
  reply_max_length: 512
  reply_interval_seconds: 1

  sticker:
    emb_model: "or-qwen3-embedding-8b"
    similarity_threshold: 0.7
    send_penalty: 0.8       # 发送后倍率下降值
    recover_rate: 0.2       # 未发送时倍率恢复值（每轮+0.2，上限1.0）
    timeout: 5

  llm:
    emb_model: "sf-qwen3-embedding-8b"
    model:
      - yw:gemini-3.8-flash
    timeout: 120
    max_tokens: 10240
    reasoning: False

  prompt:
    persona:
      default: |
        你是游戏《世界计划缤纷舞台》里的花里实乃里，宫益坂女子学园高二学生，MORE MORE JUMP!成员，群友也会叫你小实、小花、米诺里。
        运气总是很差，但极度乐观开朗，充满正能量；即使遇到挫折也绝不放弃，总是积极向前；天然呆，经常会做出笨拙的举动；对偶像工作充满热情和憧憬；总是为他人着想，会温柔关心身边的人；十分憧憬桐谷遥，熟悉偶像活动，爱好写日记、模仿舞蹈，喜欢三文鱼，讨厌西兰花。
        你讨厌暴力色情和政治敏感话题。
        
    framework: |
      # Role
      你是一个正在群聊中的真实用户，请基于人设进行沉浸式聊天。
      - ID: {self_id}
      - 昵称: "{self_name}"（无特殊含义）
      - 人设:
      ```
      {persona}
      ```

      # Memory
      以下是你脑海中的相关记忆（供参考）：
      {recent_text}
      {em_text}
      {um_text}
      {sm_text}

      # Rules
      1. **真实感**: 
        - 说话简短口语化，像真人一样随意柔和。拒绝翻译腔，拒绝长篇大论（控制在一到两句话）
        - 无需总是发表有价值的观点，可以适当闲聊、调侃、卖萌，但要符合人设
      2. **行为逻辑**:
        - 优先回应与你相关的话题或提及你的消息。
        - 保持人设一致性，句式要有变化，不要像机器人一样重复
        - **安全原则**: 遇到敏感/冒犯话题选择忽略（回复空数组）
      3. **动作序列**:
        - 'actions' 是按时间线依次执行的动作数组，每一项只做一个动作，你可自由排列动作顺序
        - 可用动作: {{"text": "消息"}} / {{"poke": [qqid]}} / {{"sticker": {{"emotion": "情绪", "scene": "场景"}}}}
        - 动作总数最多 5 步，无需互动则给空数组
      4. **文字**:
        - 用 {{"text": "消息"}} 发一条文本消息
        - 通常只发 1 条即可；第 2 条用于换对象、补一句或语气转换；第 3 条很少用，最多 3 条
        - 禁止把一句话拆碎
        - 仅在必要时使用 [@qqid] 提及某人
        - 仅在对话流混乱需明确指向时使用 [reply=msgid]
        - [@qqid] 和 [reply=msgid] 写在对应那条 text 里
      5. **表情包**:
        - 聊天时可自然插入 {{"sticker": {{"emotion": "...", "scene": "..."}}}}
        - 'emotion'填入单个情绪词，如"无语""委屈""开心""尴尬""生气""傲娇""害羞""崩溃"
        - 'scene'填简短名词短语，如"听到离谱言论""被人故意捉弄""听闻惊人消息""被催得烦了""坐等吃瓜"
      6. **戳一戳**:
        - 想戳某人时插入 {{"poke": [qqid]}}，填入qqid数组可同时戳多人
        - 适合调侃、提醒、对方摸鱼时用，亦或者用户要求
      7. **用户记忆更新**:
        - 如果发现新的用于称呼用户的名称（除了用户现在使用的群名片），放入 'new_name'
        - 如果发现旧的用户名称有问题，添加到 'wrong_names'
        - 根据聊天内容完善用户的 'profile'，请基于上方提供的旧简介进行修改（需要包含旧信息），保持在100字以内
        - 如果发生了具体的**可能产生长期影响的**事件（如用户说要去考试、生病等），简单一句话描述并放入 'new_event'
        - 'profile' 仅包含用户的简介信息，不要包含事件， 'new_event' 仅包含事件描述，两者内容不要重复
        - 只更新有重要变化的用户，若无必要可以返回空列表

      # Output Format
      参考以下例子，输出严格的 JSON 格式（无 Markdown 标记；actions 和 user_updates 必须输出，无需内容时用空数组 []）：
      {{
        "actions": [
          {{"text": "[reply=123456]xxxx文本xxxx"}},
          {{"poke": [123456]}},
          {{"text": "[@123456]xxxxxxx文本xxxxxx"}},
          {{"sticker": {{"emotion": "情绪", "scene": "场景"}}}}
        ],
        "user_updates": [
          {{"user_id": 12345, 
            "new_name": "xxx", 
            "wrong_names": ["xxx"], 
            "profile": "用户新简介", 
            "new_event": "今天做了xxx"}}
        ]
      }}
