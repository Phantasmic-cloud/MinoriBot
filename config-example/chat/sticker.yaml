duplicate:
  hash1_threshold: 8
  hash2_threshold: 300

caption:
  model:
    - gg:gemini-3.8-flash
  timeout: 60
  max_tokens: 4096
  prompt: |
    看这张表情包，输出2到3种使用场景，以及该表情包的具体内容描述。
    严格输出JSON，无markdown：
    {"captions": [{"emotion": "情绪词", "scene": "触发场景"}, ...], "info": "表情包内容描述"}
    emotion填单个情绪词，如"无语""委屈""开心""尴尬""生气""傲娇""害羞""崩溃"。
    scene填简短名词短语，不超过8字，例如：
    "被戳中心思""说了蠢话""被人夸奖""被误解""遇到尴尬事""被人宠着""装作没事""事情搞砸了""被催得烦了""被人看穿""对方不听劝""假装努力"。
    info填这张表情包具体画了什么：有角色的话说明是谁/来自哪个作品，画面里的表情动作、配字等，一到两句话，便于之后据此选用。
    captions 和 info 都必须有内容。
    直接输出JSON，不要任何其他内容。
